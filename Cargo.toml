[package]
name = "nanolike"
version = "0.1.0"
edition = "2021"
description = "A nano-inspired terminal text editor with customizable keyboard shortcuts"

[[bin]]
name = "nanolike"
path = "src/main.rs"

[dependencies]
crossterm = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
